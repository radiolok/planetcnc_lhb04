# mpgd configuration
# XHC LHB04 pendant <-> PlanetCNC TNG adapter

device:
  vendor_id: 0x10CE
  product_ids: [0xEB70, 0xEB71, 0xEB93]
  # Optional: drop incoming 8-byte reports whose XOR checksum does not match.
  # The reference driver (LinuxCNC xhc-hb04) does not verify one, so this is
  # off by default and should be validated against a real packet capture
  # before enabling. 6-byte KTURT reports carry no checksum and are never
  # dropped.
  verify_checksum: false

planetcnc:
  # Profile name for RunProfile ("" = default profile).
  profile: ""
  # Explicit library path ("" = auto-detect PlanetCNCLib64.dll / .so).
  lib_path: ""
  # attach: connect to an already-running external TNG process.
  attach: false

jogging:
  step_sizes: [0.001, 0.01, 0.1, 1.0]   # mm per wheel click; `step_size` button cycles
  default_step_index: 1                 # index into step_sizes at start-up (0.01)
  max_speed: 1000.0                     # mm/min (speed of position-following)
  override_step: 10.0                   # percent per wheel click for override
  feed_override_param: "_ovrd_speedfeed"
  spindle_override_param: "_ovrd_spindle"
  jog_speed: 12.0                       # mm/s; Jog() velocity multiplier (= _jog_speed)

polling:
  usb_hz: 100          # USB input poll rate
  display_hz: 20       # LCD refresh rate
  reconnect_ms: 2000   # USB reconnect interval
  button_debounce_ms: 50
  display_always: false  # keep sending LCD data when axis rotary = OFF

logging:
  level: "info"        # trace | debug | info | warn | error | critical | off
  file: ""             # empty = console only

# Button -> action mapping. Keys are the canonical button names (18-button
# LHB04, xhc-hb04 layout2). Supported actions:
#   estop, stop, start, pause, pause_toggle, toggle_start_pause,
#   home_all, set_work_zero, set_work_zero_xy, set_work_zero_z,
#   spindle_toggle, flood_toggle, mist_toggle,
#   feed_override, spindle_override (use `delta` in percent),
#   step_size (cycle jogging.step_sizes), command (named TNG command in `cmd`),
#   gcode (`cmd`), noop
# Unknown button or action names are a config error. Without this section the
# built-in defaults below (minus the noop entries) are used.
buttons:
  reset:        { action: "estop" }
  stop:         { action: "stop" }
  start_pause:  { action: "toggle_start_pause" }
  goto_zero:    { action: "noop" }
  rewind:       { action: "noop" }
  probe_z:      { action: "command", cmd: "Machine.Work_Position.Measure_Height" }
  macro_3:      { action: "noop" }
  half:         { action: "noop" }
  zero:         { action: "set_work_zero" }
  safe_z:       { action: "noop" }
  home:         { action: "home_all" }
  macro_1:      { action: "noop" }
  macro_2:      { action: "noop" }
  spindle:      { action: "spindle_toggle" }
  step:         { action: "step_size" }
  mode:         { action: "noop" }
  macro_6:      { action: "noop" }
  macro_7:      { action: "noop" }
